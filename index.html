<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040a12">
<title>Jarvis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600&display=swap">
<style>
:root{--bg:#040a12;--panel:#0a1623;--ink:#d8f6ff;--dim:#6f8d9b;--arc:#3fe0ff;--warm:#ffb347}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% 18%,#0b2233 0,var(--bg) 70%);color:var(--ink);font:500 16px/1.4 Rajdhani,system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px}
h1{font-size:26px;font-weight:600;letter-spacing:.14em}
button,input,select{font:inherit;color:inherit}
#gear{background:none;border:1px solid #1d3647;border-radius:10px;padding:6px 12px;color:var(--dim)}
#set{display:none;background:var(--panel);border:1px solid #1d3647;border-radius:14px;padding:12px;margin-bottom:8px;gap:10px;flex-direction:column;max-height:58vh;overflow-y:auto}
#set.on{display:flex}
#set label{display:flex;flex-direction:column;font-size:14px;color:var(--dim);gap:4px}
#set input[type=text],#set input[type=password],#set select{background:#06101a;border:1px solid #1d3647;border-radius:8px;padding:8px;color:var(--ink)}
#set .row{flex-direction:row;align-items:center;gap:8px}
#set button{background:none;border:1px solid #1d3647;border-radius:10px;padding:8px;color:var(--ink)}
#set small{color:var(--dim);font-size:13px}
#set a{color:var(--arc)}
input[type=range]{accent-color:var(--arc);width:100%}
#orbwrap{display:grid;place-items:center;padding:6px 0 2px}
#orb{position:relative;width:176px;height:176px;border:0;background:none;border-radius:50%;cursor:pointer}
.r{position:absolute;border-radius:50%;border:2px solid transparent}
.r1{inset:0;border-color:#1f6f86;border-style:dashed;animation:spin 28s linear infinite}
.r2{inset:16px;border-top-color:var(--arc);border-bottom-color:var(--arc);animation:spin 9s linear infinite reverse}
.r3{inset:36px;border:3px solid #124a5c;border-left-color:var(--arc);animation:spin 5s linear infinite}
.core{position:absolute;inset:62px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--arc) 38%,#0a5a72 100%);box-shadow:0 0 28px 6px #3fe0ff66;transition:transform .3s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{50%{transform:scale(1.22);box-shadow:0 0 46px 14px #3fe0ff99}}
body[data-s=listen] .core,body[data-s=think] .core{animation:beat 1s ease-in-out infinite}
body[data-s=listen] .r2,body[data-s=think] .r2{animation-duration:3s}
body[data-s=speak] .core{background:radial-gradient(circle,#fff 0,var(--warm) 40%,#7a4a10 100%);box-shadow:0 0 30px 8px #ffb34766;animation:beat .7s ease-in-out infinite}
body[data-s=speak] .r3{border-left-color:var(--warm)}
#stat{text-align:center;min-height:24px;color:var(--dim);font-size:17px;padding:0 8px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 0;min-height:0}
.m{max-width:88%;padding:8px 12px;border-radius:12px;background:var(--panel);overflow-wrap:anywhere}
.m.u{align-self:flex-end;color:var(--dim);border:1px solid #1d3647;background:none}
.m.j{align-self:flex-start;border-left:3px solid var(--arc)}
.m a{color:var(--arc)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;flex:none}
#chips button{flex:none;background:none;border:1px solid #1d3647;border-radius:20px;padding:5px 12px;color:var(--ink)}
#bar{display:flex;gap:8px;padding-bottom:10px}
#txt{flex:1;background:var(--panel);border:1px solid #1d3647;border-radius:12px;padding:10px 12px;min-width:0}
#go{background:var(--arc);color:#03141c;border:0;border-radius:12px;padding:0 18px;font-weight:600}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-s="idle">
<header><h1>JARVIS</h1><button id="gear">Settings</button></header>

<section id="set">
  <label>Language you speak
    <select id="lang">
      <option value="en-IN">English (India)</option>
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="hi-IN">हिन्दी Hindi</option>
      <option value="te-IN">తెలుగు Telugu</option>
    </select>
  </label>
  <label>Jarvis’s voice
    <select id="voice"></select>
  </label>
  <label>Speed <input type="range" id="rate" min="0.7" max="1.3" step="0.05"></label>
  <label>Pitch (lower is deeper) <input type="range" id="pitch" min="0.6" max="1.4" step="0.05"></label>
  <button id="test">Test voice</button>
  <label class="row"><input type="checkbox" id="convo"> Keep listening after each reply</label>
  <label>Free Gemini key (Jarvis’s brain)
    <input type="password" id="key" placeholder="Paste key here" autocomplete="off">
  </label>
  <small>1. Open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> and sign in. 2. Tap Create API key and copy it. 3. Come back and paste it above. It stays on this phone only.</small>
  <label>Model
    <input type="text" id="model" autocomplete="off">
  </label>
  <button id="clr">Clear conversation memory</button>
</section>

<div id="orbwrap">
  <button id="orb" aria-label="Tap to talk"><i class="r r1"></i><i class="r r2"></i><i class="r r3"></i><i class="core"></i></button>
</div>
<div id="stat" aria-live="polite"></div>
<div id="log"></div>
<div id="chips"></div>
<div id="bar">
  <input id="txt" type="text" placeholder="Or type to me" autocomplete="off" enterkeyhint="send">
  <button id="go">Send</button>
</div>

<script>
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
const S={key:'',model:'gemini-3.5-flash-lite',lang:'en-IN',voice:'',rate:1,pitch:1,convo:true};
try{Object.assign(S,JSON.parse(ls('jarvis2')||'{}'))}catch(e){}
const save=()=>ls('jarvis2',JSON.stringify(S));
let hist=[];try{hist=JSON.parse(ls('jarvis_hist')||'[]')}catch(e){}
const saveHist=()=>ls('jarvis_hist',JSON.stringify(hist.slice(-30)));
const log=$('#log'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,active=false,busy=false,turn=0,spk=0,voices=[];

const clean=t=>t.replace(/[*#_`~>]/g,'').replace(/\p{Extended_Pictographic}/gu,'').replace(/\s+/g,' ').trim();
function setState(s){
  document.body.dataset.s=s;
  $('#stat').textContent={idle:'Tap the orb and talk to me',listen:'Listening…',think:'Thinking…',speak:'Speaking… tap the orb to interrupt'}[s];
}
function add(t,who){const d=document.createElement('div');d.className='m '+who;d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight}

/* ---------- Voices ---------- */
const vl=v=>v.lang.replace('_','-');
const langVoices=()=>voices.filter(v=>vl(v).toLowerCase().startsWith(S.lang.slice(0,2).toLowerCase()));
function pickVoice(){
  const l=langVoices();
  return l.find(v=>v.name===S.voice)||l.find(v=>/google|natural|neural|enhanced/i.test(v.name)&&vl(v)===S.lang)||l.find(v=>vl(v)===S.lang)||l[0]||null;
}
function fillVoices(){
  const sel=$('#voice'),l=langVoices();
  sel.innerHTML='';
  l.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+vl(v)+')';sel.append(o)});
  const p=pickVoice();if(p)sel.value=p.name;
  sel.parentElement.style.display=l.length?'':'none';
}
function loadVoices(){voices=speechSynthesis.getVoices()||[];fillVoices()}
function stopSpeak(){spk++;try{speechSynthesis.cancel()}catch(e){}}
function speak(text,done){
  stopSpeak();const id=spk;
  if(!window.speechSynthesis||!text){done();return}
  const parts=[];let cur='';
  (text.match(/[^.!?।]+[.!?।]*\s*/g)||[text]).forEach(s=>{if(cur&&(cur+s).length>170){parts.push(cur);cur=s}else cur+=s});
  if(cur)parts.push(cur);
  let i=0;
  const next=()=>{
    if(id!==spk)return;
    if(i>=parts.length){done();return}
    const u=new SpeechSynthesisUtterance(parts[i++]);
    u.lang=S.lang;u.rate=S.rate;u.pitch=S.pitch;
    if(S.voice){const v=pickVoice();if(v)u.voice=v}
    let started=false;
    const w=setTimeout(()=>{
      if(id===spk&&!started){spk++;try{speechSynthesis.cancel()}catch(e){}add('I couldn’t speak out loud. Open Settings and try another voice.','j');done()}
    },4000);
    u.onstart=()=>{started=true;clearTimeout(w);setState('speak')};
    u.onend=()=>{clearTimeout(w);next()};
    u.onerror=e=>{
      clearTimeout(w);
      if(id===spk&&e.error&&!/interrupted|canceled/.test(e.error)&&i===1)add('Voice problem ('+e.error+'). Open Settings and try another voice.','j');
      next();
    };
    speechSynthesis.speak(u);
  };
  setTimeout(next,60);
}
function reply(r){
  const c=clean(String(r));add(c,'j');busy=true;setState('speak');
  speak(c,()=>{busy=false;if(S.convo)listen();else setState('idle')});
}

/* ---------- Quick phone commands ---------- */
const APPS={youtube:'https://www.youtube.com',whatsapp:'https://wa.me/',instagram:'https://www.instagram.com',gmail:'https://mail.google.com',maps:'https://maps.google.com',spotify:'https://open.spotify.com',telegram:'https://t.me/',twitter:'https://x.com',facebook:'https://www.facebook.com',linkedin:'https://www.linkedin.com',github:'https://github.com','play store':'https://play.google.com/store'};
function open(u,label){
  const d=document.createElement('div');d.className='m j';
  const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent='Tap to open '+label;
  d.append(a);log.append(d);log.scrollTop=log.scrollHeight;
  window.open(u,'_blank');
  return 'Opening '+label+'.';
}
async function local(t){
  let m;
  if(/^(what('?s| is) the time|what time is it|time now)\b/.test(t))return 'It’s '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'.';
  if(/^(what('?s| is) (the )?(date|day)|what day is it)\b/.test(t))return 'Today is '+new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';
  if(/battery/.test(t)&&t.length<40){
    if(!navigator.getBattery)return 'I can’t read the battery in this browser.';
    const b=await navigator.getBattery();
    return 'Battery is at '+Math.round(b.level*100)+' percent'+(b.charging?' and charging.':'.');
  }
  if(m=t.match(/timer (?:for )?(\d+) (second|minute|hour)/)){
    const n=+m[1],ms=n*{second:1e3,minute:6e4,hour:36e5}[m[2]];
    setTimeout(()=>{turn++;busy=true;speak('Your '+n+' '+m[2]+' timer is done.',()=>{busy=false;setState('idle')})},ms);
    return 'Timer set for '+n+' '+m[2]+(n>1?'s':'')+'. Keep this page open.';
  }
  if(m=t.match(/^(?:call|dial) ([\d\s+]+)$/))return open('tel:'+m[1].replace(/\s/g,''),'the dialer');
  if(m=t.match(/^(?:navigate|directions?) to (.+)/)||t.match(/^take me to (.+)/))return open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(m[1]),'Maps');
  if(m=t.match(/^play (.+?)(?: on youtube)?$/))return open('https://www.youtube.com/results?search_query='+encodeURIComponent(m[1]),'YouTube');
  if(m=t.match(/^(?:open|launch) (.+)/)){const k=Object.keys(APPS).find(k=>m[1].includes(k));if(k)return open(APPS[k],k)}
  if(m=t.match(/^(?:search|google|look up) (?:for )?(.+)/))return open('https://www.google.com/search?q='+encodeURIComponent(m[1]),'search results');
  return null;
}

/* ---------- The brain ---------- */
const SYS=()=>'You are Jarvis, a warm, smart personal assistant who talks like a close, thoughtful friend. Listen carefully and work out what the person really needs. When they share a problem, acknowledge it in a few words, then give two or three practical suggestions and, when it helps, ask one short follow-up question. Be direct and honest, never preachy. Your replies are spoken aloud, so use plain natural sentences with no markdown, no lists, no emojis, usually two to five sentences. Reply in the same language the person uses; if they mix languages, such as Hinglish or Tenglish, mix the same way. If you are unsure, say so instead of guessing. The current date and time is '+new Date().toLocaleString()+'.';
const ctx=()=>{const h=hist.slice(-20);while(h.length&&h[0].role!=='user')h.shift();return h};
function errText(j){
  const m=(j.error&&j.error.message)||'';
  if(/API key/i.test(m))return 'That API key doesn’t look right. Please check it in Settings.';
  if(j.error&&j.error.code===429)return 'I’ve reached the free limit for the moment. Give me a minute, or pick another model in Settings.';
  return 'I couldn’t get an answer just now. '+m.slice(0,120);
}
async function post(m,body){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body,signal:ac.signal});
    return await r.json();
  }finally{clearTimeout(tm)}
}
async function ask(q){
  hist.push({role:'user',parts:[{text:q}]});
  let last='';
  try{
    const body=JSON.stringify({systemInstruction:{parts:[{text:SYS()}]},contents:ctx(),generationConfig:{maxOutputTokens:1024}});
    for(const m of [...new Set([S.model,'gemini-3.5-flash-lite','gemini-3.8-flash'])]){
      let j;
      try{j=await post(m,body)}
      catch(e){last=e.name==='AbortError'?'The AI took too long to answer. Check your internet connection and try again.':'I can’t reach the AI service: '+e.message;continue}
      const a=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
      if(a){hist.push({role:'model',parts:[{text:a}]});saveHist();return a}
      last=j.error?errText(j):'The AI sent an empty answer.';
      if(!(j.error&&(j.error.code===404||j.error.code===503)))break;
    }
  }catch(e){last='Something went wrong: '+e.message}
  hist.pop();
  return last||'I didn’t get an answer. Please try again.';
}

/* ---------- Conversation loop ---------- */
async function handle(raw){
  const t=raw.trim();if(!t)return;
  const my=++turn;busy=true;
  try{rec&&rec.abort()}catch(e){}
  add(t,'u');setState('think');
  const slow=setTimeout(()=>{if(my===turn)$('#stat').textContent='Still thinking…'},5000);
  let r=null;
  try{
    try{r=await local(t.toLowerCase().replace(/[.,!?]+$/,''))}catch(e){}
    if(r===null){
      if(!S.key){r='To talk with you properly I need my AI brain. Open Settings and paste your free Gemini key. The steps are right there.';$('#set').classList.add('on')}
      else r=await ask(t);
    }
  }catch(e){r='Something went wrong: '+e.message}
  clearTimeout(slow);
  if(my!==turn)return;
  try{reply(r)}catch(e){add('Error: '+e.message,'j');busy=false;setState('idle')}
}
function listen(){
  if(!SR){add('Voice input needs Chrome on Android. You can still type to me.','j');setState('idle');return}
  if(active)return;
  stopSpeak();
  rec=new SR();rec.lang=S.lang;rec.interimResults=true;
  let got=false;
  rec.onstart=()=>{active=true;setState('listen')};
  rec.onresult=e=>{
    let t='',fin=false;
    for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;fin=fin||e.results[i].isFinal}
    $('#stat').textContent=t;
    if(fin&&!got){got=true;handle(t)}
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed')add('Microphone is blocked. Allow it in Chrome’s site settings for this page.','j');
    if(e.error==='network')add('Voice recognition needs an internet connection.','j');
  };
  rec.onend=()=>{active=false;if(!busy)setState('idle')};
  try{rec.start()}catch(e){}
}

/* ---------- UI wiring ---------- */
$('#orb').onclick=()=>{
  turn++;busy=false;
  if(active){try{rec.abort()}catch(e){}setState('idle');return}
  stopSpeak();listen();
};
$('#gear').onclick=()=>$('#set').classList.toggle('on');
$('#lang').value=S.lang;$('#key').value=S.key;$('#model').value=S.model;
$('#convo').checked=S.convo;$('#rate').value=S.rate;$('#pitch').value=S.pitch;
$('#lang').onchange=e=>{S.lang=e.target.value;S.voice='';save();fillVoices()};
const test=()=>{turn++;busy=true;speak('Hello, I’m Jarvis. This is how I sound. Change my voice, speed or pitch until it feels right.',()=>{busy=false;setState('idle')})};
$('#voice').onchange=e=>{S.voice=e.target.value;save();test()};
$('#rate').onchange=e=>{S.rate=+e.target.value;save();test()};
$('#pitch').onchange=e=>{S.pitch=+e.target.value;save();test()};
$('#test').onclick=test;
$('#convo').onchange=e=>{S.convo=e.target.checked;save()};
$('#key').oninput=e=>{
  const had=!!S.key;S.key=e.target.value.trim();save();
  if(!had&&S.key.length>25){add('Brain connected. Tap the orb and tell me what’s on your mind.','j');$('#set').classList.remove('on')}
};
$('#model').onchange=e=>{S.model=e.target.value.trim()||'gemini-3.5-flash-lite';save()};
$('#clr').onclick=()=>{hist=[];saveHist();log.innerHTML='';add('Memory cleared. Fresh start.','j')};
const send=()=>{const v=$('#txt').value.trim();if(v){$('#txt').value='';handle(v)}};
$('#go').onclick=send;
$('#txt').onkeydown=e=>{if(e.key==='Enter')send()};
['I’m stressed about my exams','Help me plan my day','Give me career advice','What’s the time','Play lo-fi songs','Timer 5 minutes'].forEach(c=>{
  const b=document.createElement('button');b.textContent=c;b.onclick=()=>handle(c);$('#chips').append(b);
});
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
if(S.key)add('Hi, I’m Jarvis. Tap the orb and tell me what’s on your mind.','j');
else{add('Hi, I’m Jarvis. To chat like a real assistant I need a free Gemini key. Open Settings, follow the three steps, and paste it in.','j');$('#set').classList.add('on')}
setState('idle');
</script>
</body>
</html>
